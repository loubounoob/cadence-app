name: Free harvest (Étage 1)

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours — cheap and steady, never a burst
  workflow_dispatch: {}       # "Run workflow" button for a manual pass

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright-core
          npx playwright install --with-deps chromium
      - name: Harvest
        env:
          CADENCE_URL: ${{ secrets.CADENCE_URL }}
          FREE_HARVEST_SECRET: ${{ secrets.FREE_HARVEST_SECRET }}
        run: node harvest/free-harvest.mjs
