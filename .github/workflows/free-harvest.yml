name: Free harvest (Étage 1)

on:
  schedule:
    # every 20 min — this now also drains on-demand tag requests queued by
    # live searches (see /api/free-request + /api/free-tags), so the free
    # tier keeps up with real demand instead of only refreshing a fixed
    # curated list every few hours. Still a ~2min run, well inside GitHub's
    # free Actions minutes at this frequency on a public repo.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}       # "Run workflow" button for a manual pass

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright-core
          npx playwright install --with-deps chromium
      - name: Harvest
        env:
          CADENCE_URL: ${{ secrets.CADENCE_URL }}
          FREE_HARVEST_SECRET: ${{ secrets.FREE_HARVEST_SECRET }}
        run: node harvest/free-harvest.mjs
